[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "health-model-report"
version = "0.1.0"
description = "A local dashboard and shareable reports for healthcare classification models."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2"]
keywords = ["healthcare", "machine-learning", "evaluation", "calibration", "fairness"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.urls]
Repository = "https://github.com/pemalama12/health-model-report"
Issues = "https://github.com/pemalama12/health-model-report/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
health-model-report = "health_model_report.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
health_model_report = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
